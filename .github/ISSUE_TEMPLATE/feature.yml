name: Feature
description: 기능 추가 또는 기능 변경
title: "[feat] "
labels: ["feat"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 작업의 목적과 배경을 작성해 주세요.
      placeholder: |
        어떤 문제를 해결하거나 어떤 기능을 추가하려는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 이번 이슈에서 처리할 범위를 작성해 주세요.
      placeholder: |
        - 
        -
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 완료 여부를 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] 
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 의존성
      description: 선행 이슈나 관련 PR이 있다면 작성해 주세요.
      placeholder: "예: #6 완료 필요"
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 참고할 자료나 링크가 있다면 작성해 주세요.
    validations:
      required: false
