nodes:
  - { id: enter, label: 앱 서비스 진입, type: terminal }
  - { id: first, label: 최초 진입, type: branch }
  - { id: onb, label: 온보딩 (ONB), type: main }
  - { id: login, label: 로그인, type: branch }
  - { id: home, label: 모임 홈 (HOME), type: main }
  - { id: acc, label: 로그인/회원가입 (ACC), type: main }
  - { id: social, label: 소셜 로그인, type: feature }
  - { id: nick, label: 기본 닉네임 입력, type: feature }
  - { id: accDone, label: 로그인/회원가입 완료, type: terminal }
