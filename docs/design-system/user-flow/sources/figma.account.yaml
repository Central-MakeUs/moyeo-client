  - { from: fab, to: crt, label: 모임 생성 (CRT)로 이어짐 } # → figma.crt.yaml
  - { from: ongoing, to: view, label: 모임 현황 (VIEW)로 이어짐 } # → figma.view.yaml
  - { from: fixed, to: view, label: 모임 현황 (VIEW)로 이어짐 }
